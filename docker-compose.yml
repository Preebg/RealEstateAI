services:
  api:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173}
    volumes:
      # Hot-reload domain code during local development
      - ./:/app
    command: >
      uvicorn api.main:app --host 0.0.0.0 --port 8000 --reload
