# Energy defaults: containers do not auto-restart. The harvester and wake proxy
# start the stack on demand; stack_idle_guard.ps1 stops it after idle time.
# Set STACK_RESTART_POLICY=unless-stopped in .env for always-on dev machines.
services:
  postgres:
    image: postgres:16-alpine
    restart: ${STACK_RESTART_POLICY:-no}
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-capeigen}
      POSTGRES_USER: ${POSTGRES_USER:-capeigen}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-capeigen}
    ports:
      # Host access for pg_dump / GUI tools (not required by api/harvester)
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-capeigen} -d ${POSTGRES_DB:-capeigen}"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

  postgrest:
    image: postgrest/postgrest:v12.2.3
    restart: ${STACK_RESTART_POLICY:-no}
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGRST_DB_URI: postgres://capeigen_authenticator:capeigen_authenticator@postgres:5432/${POSTGRES_DB:-capeigen}
      PGRST_DB_SCHEMAS: public
      PGRST_DB_ANON_ROLE: capeigen_app
      PGRST_DB_EXTRA_SEARCH_PATH: public
      # No JWT secret: trusted docker network; FastAPI validates Supabase Auth JWTs.
      PGRST_OPENAPI_SERVER_PROXY_URI: http://localhost:3001
    expose:
      - "3000"

  rest-gateway:
    image: caddy:2-alpine
    restart: ${STACK_RESTART_POLICY:-no}
    depends_on:
      - postgrest
    ports:
      - "${DATABASE_REST_PORT:-3001}:3001"
    volumes:
      - ./docker/rest/Caddyfile:/etc/caddy/Caddyfile:ro

  api:
    build: .
    restart: ${STACK_RESTART_POLICY:-no}
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173,https://capeigen.preebg.dev}
      # Default: local PostgREST. Set DATABASE_REST_URL_DOCKER= (empty) to use hosted Supabase data.
      DATABASE_REST_URL: "${DATABASE_REST_URL_DOCKER:-http://rest-gateway:3001}"
      SUPABASE_AUTH_URL: "${SUPABASE_AUTH_URL:-${SUPABASE_URL}}"
      GOOGLE_WEB_CLIENT_ID: ${GOOGLE_WEB_CLIENT_ID:-}
      GOOGLE_WEB_CLIENT_SECRET: ${GOOGLE_WEB_CLIENT_SECRET:-}
      STACK_ACTIVITY_FILE: /app/data/.last_api_activity
    volumes:
      - ./data:/app/data
    depends_on:
      rest-gateway:
        condition: service_started

volumes:
  postgres_data:
